name: Createive bootstrap trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  materialize:
    if: github.event.issue.title == '[internal] materialize Createive system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: feat/design-management-system

      - name: Materialize repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part-* | base64 --decode > /tmp/createive.tar.gz
          tar -xzf /tmp/createive.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-createive.yml

      - name: Validate generated system
        run: npm run check

      - name: Commit materialized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "createive-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add complete creative design management system"
          git push origin HEAD:feat/design-management-system
