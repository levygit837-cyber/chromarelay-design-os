name: Bootstrap ChromaRelay repository

on:
  push:
    branches:
      - feat/design-management-system
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-chromarelay.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: feat/design-management-system

      - name: Materialize repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part-* | base64 --decode > /tmp/chromarelay.tar.gz
          tar -xzf /tmp/chromarelay.tar.gz -C .
          rm -rf .bootstrap

      - name: Validate generated system
        run: npm run check

      - name: Commit materialized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chromarelay-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add complete creative design management system"
          git push origin HEAD:feat/design-management-system
