name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: Typecheck harness adapter
        run: npm run typecheck:omp
      - run: npm run validate:framework
      - name: Smoke-test portable overlay
        run: |
          TARGET="$(mktemp -d)"
          node scripts/install.mjs --target "$TARGET" --omp
          node dist/src/cli.js validate-framework --system "$TARGET/.chromarelay/system"
