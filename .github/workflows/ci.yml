name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Typecheck harness adapter
        run: npm run typecheck:omp
      - run: npm run validate:framework
      - name: Smoke-test portable overlay
        run: |
          mkdir -p /tmp/createive-target
          node scripts/install.mjs --target /tmp/createive-target --omp
          node dist/src/cli.js validate-framework --system /tmp/createive-target/.createive/system
