# Merge these entries into ~/.omp/agent/config.yml and map aliases to models available in your environment.
modelRoles:
  chromarelay_coordinator: "@slow"
  chromarelay_product: "@slow"
  chromarelay_research: "@task"
  chromarelay_art: "@designer"
  chromarelay_system: "@slow"
  chromarelay_builder: "@default"
  chromarelay_auditor: "@task"
  chromarelay_critic: "@slow"
  chromarelay_repair: "@default"
  chromarelay_advisor: "@slow"

task:
  maxConcurrency: 6
  maxRecursionDepth: 2
  enableEffort: true

# Recommended for agent batches and progress delivery.
async:
  enabled: true

# Required only when using process supervision through hub.
launch:
  enabled: true
