# Merge these entries into ~/.omp/agent/config.yml and map aliases to models available in your environment.
modelRoles:
  createive_coordinator: "@slow"
  createive_product: "@slow"
  createive_research: "@task"
  createive_art: "@designer"
  createive_system: "@slow"
  createive_builder: "@default"
  createive_auditor: "@task"
  createive_critic: "@slow"
  createive_repair: "@default"
  createive_advisor: "@slow"

task:
  maxConcurrency: 6
  maxRecursionDepth: 2
  enableEffort: true

# Recommended for agent batches and progress delivery.
async:
  enabled: true

# Required only when using process supervision through hub.
launch:
  enabled: true
